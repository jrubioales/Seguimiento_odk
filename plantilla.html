<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Seguimiento ODK</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --ring: rgba(11,11,11,0.10);
  --accent: #2a78d6;
  --accent-wash: rgba(42,120,214,0.10);
  --ok: #0ca30c;
  --ok-ink: #006300;
  --nov: #fab219;
  --nov-ink: #8a5a00;
  --falta: #d03b3b;
  --track: #e8e7e1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --ring: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16);
    --ok-ink: #0ca30c; --nov-ink: #fab219; --track: #2c2c2a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --ring: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-wash: rgba(57,135,229,0.16);
  --ok-ink: #0ca30c; --nov-ink: #fab219; --track: #2c2c2a;
}
/* SOS, planes, check outs y KBDS: tarjetas y mini pestañas Avance / Faltantes */
.mref { --m-ok: #1e8e3e; --m-falta: #d93025; --m-medio: #e8a33d; --m-azul: #1a73e8; --m-pista: #eef1f4; --m-cab: #fafbfc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mref { --m-ok: #34a853; --m-azul: #3987e5; --m-pista: #2c2c2a; --m-cab: #232321; } }
:root[data-theme="dark"] .mref { --m-ok: #34a853; --m-azul: #3987e5; --m-pista: #2c2c2a; --m-cab: #232321; }
.m-tarjetas { display: grid; gap: 10px; margin: 14px 0; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.m-t { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; }
.m-t b { display: block; font-size: 28px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.m-t span { color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
.m-t.ok b { color: var(--m-ok); } .m-t.falta b { color: var(--m-falta); } .m-t.medio b { color: var(--m-medio); } .m-t.azul b { color: var(--m-azul); }
.m-nav { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--grid); margin: 18px 0 0; }
.m-nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; margin-bottom: -2px; }
.m-nav button.on { color: var(--m-azul); border-bottom-color: var(--m-azul); }
.m-sec { padding: 18px 0 0; }
.m-caja { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.m-caja h2 { font-size: 15px; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-2); }
.m-caja p.nota { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; }
.m-barra { display: grid; grid-template-columns: 170px 1fr 124px; gap: 10px; align-items: center; padding: 4px 6px; width: 100%;
  border: 0; background: none; border-radius: 6px; text-align: left; cursor: pointer; }
.m-barra:hover, .m-barra:focus-visible { background: var(--m-cab); outline: none; }
.m-barra .nom { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-pista { background: var(--m-pista); border-radius: 5px; height: 20px; overflow: hidden; display: flex; gap: 2px; }
.m-pista i { display: block; height: 100%; }
.m-pista i.s { background: var(--m-ok); } .m-pista i.n { background: var(--m-medio); }
.m-barra .cif { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.m-barra .cif b { color: var(--ink); }
.m-mandos { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.m-mandos select, .m-mandos input { padding: 7px 10px; border: 1px solid var(--grid); border-radius: 7px; background: var(--surface); }
.m-mandos input[type=text] { min-width: 190px; }
.m-sello { color: var(--ink-2); font-size: 13px; }
.m-btn { font-weight: 600; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--m-azul); background: var(--m-azul); color: #fff; cursor: pointer; }
.m-btn.claro { background: var(--surface); color: var(--m-azul); }
.m-btn.wa { background: #25d366; border-color: #1eb257; color: #fff; }
.m-scroll { max-height: 560px; overflow: auto; border: 1px solid var(--grid); border-radius: 8px; }
.m-scroll table { width: 100%; min-width: 820px; border-collapse: collapse; font-size: 13px; }
.m-scroll th, .m-scroll td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.m-scroll th { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--ink-2); background: var(--m-cab);
  position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap; }
.m-scroll tbody tr:hover { background: var(--m-cab); }
.m-vacio { color: var(--ink-2); padding: 26px; text-align: center; }
.m-pil { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.m-pil.subida { background: #e4f3e7; color: #15692f; }
.m-pil.falta { background: #fde9e7; color: #b3261e; }
.m-pil.nov { background: #fdf2e0; color: #8a5a00; }
.m-nov { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
#mLienzo canvas { max-width: 100%; border: 1px solid var(--grid); border-radius: 8px; margin-top: 12px; }
@media (max-width: 600px) {
  .m-barra { grid-template-columns: 104px 1fr 96px; gap: 6px; }
  .m-t b { font-size: 22px; }
  .m-mandos input[type=text] { min-width: 0; flex: 1; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 18px 0 10px; }
header h1 { font-size: 20px; margin: 0; }
header .upd { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
header .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
header .sp { flex: 1; }
.theme { border: 1px solid var(--ring); background: var(--surface); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.theme:disabled { cursor: default; opacity: .6; }
#actMsg { font-size: 13px; color: var(--ink-2); }
#actMsg.err { color: var(--falta); }
#tokDlg { border: 1px solid var(--ring); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 18px; max-width: 420px; width: calc(100% - 32px); }
#tokDlg::backdrop { background: rgba(0,0,0,.35); }
#tokDlg h2 { font-size: 16px; margin: 0 0 6px; }
#tokDlg p { font-size: 13px; color: var(--ink-2); margin: 0 0 12px; }
#tokDlg input { width: 100%; background: var(--page); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
#tokDlg .row { display: flex; gap: 8px; justify-content: flex-end; }
#tokDlg .ok { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; }

nav { display: flex; gap: 2px; border-bottom: 1px solid var(--grid); overflow-x: auto; scrollbar-width: none; }
nav button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 6px; }
.filters select, .filters input { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.filters .per { font-weight: 600; max-width: 340px; }
.filters input { flex: 1 1 200px; }
.filters .clear { border: 0; background: none; color: var(--accent); cursor: pointer; }

/* avance por semana / mes */
.periodos { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: thin; }
.per-btn { flex: 1 0 118px; max-width: 170px; text-align: left; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.per-btn:hover { border-color: var(--muted); }
.per-btn[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--accent-wash); }
.per-n { font-size: 13px; font-weight: 600; white-space: nowrap; }
.en-curso { font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; }
.per-r { font-size: 11px; color: var(--muted); white-space: nowrap; }
.per-p { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.per-p.bajo { color: var(--falta); }
.per-btn .track { height: 6px; }

/* franja de avance */
.avance { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; margin: 10px 0 16px; }
.avance .big { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
.avance .big small { font-size: 14px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; margin-left: 4px; }
.avance .bar { flex: 1 1 220px; }
.track { height: 10px; border-radius: 5px; background: var(--track); display: flex; overflow: hidden; gap: 2px; }
.track i { display: block; height: 100%; }
.i-ok { background: var(--ok); } .i-nov { background: var(--nov); }
.avance .nums { display: flex; gap: 18px; font-size: 13px; color: var(--ink-2); }
.avance .nums b { display: block; font-size: 18px; color: var(--ink); }

/* cuadro principal */
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.card-head h2 { margin: 0; font-size: 16px; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--ring); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.btn2 { border: 1px solid var(--ring); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--muted); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl { overflow-x: auto; }
tr.persona { cursor: pointer; }
tr.persona:hover td { background: var(--surface-2); }
tr.persona.open td { background: var(--accent-wash); border-bottom-color: transparent; }
.caret { display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
tr.open .caret { transform: rotate(90deg); }
.sub { font-size: 12px; color: var(--muted); }
.falta-n { color: var(--falta); font-weight: 650; }
.cero { color: var(--ok-ink); font-weight: 650; }
.mini { display: inline-block; width: 80px; vertical-align: middle; margin-right: 8px; }
.mini .track { height: 6px; }

.det td { background: var(--accent-wash); padding: 4px 8px 14px 30px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 700px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.cols h3 { font-size: 13px; margin: 6px 0 6px; display: flex; align-items: center; gap: 6px; }
.cols ul { list-style: none; margin: 0; padding: 0; }
.cols li { padding: 5px 0; border-top: 1px solid var(--grid); font-size: 13px; }
.cols li:first-child { border-top: 0; }
.vacio { color: var(--muted); font-size: 13px; padding: 4px 0; }

.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.tag .ic { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; color: #fff; flex: none; }
.t-ok .ic { background: var(--ok); } .t-ok { color: var(--ok-ink); }
.t-nov .ic { background: var(--nov); color: #0b0b0b; } .t-nov { color: var(--nov-ink); }
.t-falta .ic { background: var(--falta); } .t-falta { color: var(--falta); }
.nov-txt { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { border: 1px solid var(--ring); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.more { display: block; margin: 12px auto 0; }
.empty { color: var(--muted); text-align: center; padding: 28px 0; }

#lock { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
#lock h1 { font-size: 20px; margin: 0 0 6px; }
#lock p { color: var(--ink-2); margin: 0 0 14px; }
#lock form { display: flex; gap: 8px; }
#lock input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; }
#lock button { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
#lock .err { color: var(--falta); font-size: 13px; min-height: 20px; margin-top: 8px; }
/* fotos de exhibiciones */
.galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.foto { position: relative; display: flex; flex-direction: column; text-align: left; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; overflow: hidden; padding: 0; cursor: pointer; }
.foto:hover { border-color: var(--muted); }
.foto .img { aspect-ratio: 3 / 4; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 12px; overflow: hidden; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto.doble { grid-column: span 2; }
.foto.doble .img { aspect-ratio: 3 / 2; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.foto .cel { position: relative; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
.etq { position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 600; color: #fff; background: rgba(0,0,0,.62); border-radius: 5px; padding: 1px 6px; }
#fotoNav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.foto .pie { padding: 7px 9px 9px; font-size: 12px; line-height: 1.35; }
.foto .pie b { display: block; font-size: 13px; }
.badge { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 700; color: #fff; border-radius: 6px; padding: 2px 7px; letter-spacing: .03em; }
.b-act { background: #1e7d3a; } .b-nue { background: var(--accent); } .b-per { background: #b88600; }
.ppt-btn { border: 0; background: #e2211c; color: #fff; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
.ppt-btn:disabled { opacity: .6; cursor: default; }
#fotoDlg { border: 0; padding: 0; background: transparent; max-width: min(96vw, 900px); width: 100%; }
#fotoDlg::backdrop { background: rgba(0,0,0,.8); }
#fotoDlg .caja { background: var(--surface); color: var(--ink); border-radius: 12px; overflow: hidden; }
#fotoDlg .grande { background: #000; display: grid; place-items: center; min-height: 240px; }
#fotoDlg .grande img { max-width: 100%; max-height: 72vh; display: block; }
#fotoDlg .info { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 13px; }
#fotoDlg .info b { font-size: 15px; }
@media (max-width: 600px) {
  .galeria { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .filters select, .filters .per { flex: 1 1 45%; max-width: none; }
  .avance .big { font-size: 26px; }
  .hide-sm { display: none; }
}
@media (forced-colors: active) { .track i { border: 1px solid CanvasText; } }
</style>
</head>
<body>
<div id="lock" hidden>
  <h1>Seguimiento ODK</h1>
  <p>Ingresa la clave para ver el seguimiento.</p>
  <form id="lockForm"><input id="lockPass" type="password" autocomplete="current-password" placeholder="Clave" required><button>Entrar</button></form>
  <div class="err" id="lockErr"></div>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <h1>Seguimiento ODK</h1>
    <span class="upd"><span class="live" aria-hidden="true"></span><span id="upd"></span></span>
    <span class="sp"></span>
    <span id="actMsg" role="status"></span>
    <button class="theme" id="actBtn" type="button" hidden>↻ Actualizar</button>
    <button class="theme" id="themeBtn" type="button">◐ Tema</button>
  </header>
  <dialog id="tokDlg">
    <form method="dialog" id="tokForm">
      <h2>Token de GitHub</h2>
      <p>Para pedir la actualización hace falta el token <b>cron-seguimiento</b> (permiso Actions de Seguimiento_odk). Se guarda solo en este navegador.</p>
      <input id="tokIn" type="password" placeholder="github_pat_…" autocomplete="off" required>
      <div class="row"><button class="btn2" value="no" formnovalidate>Cancelar</button><button class="ok" value="si">Actualizar</button></div>
    </form>
  </dialog>
  <dialog id="fotoDlg"><div class="caja">
    <div class="grande"><img id="fotoImg" alt=""></div>
    <div class="info"><div><div id="fotoInfo"></div><div id="fotoNav"></div></div>
      <div style="display:flex;gap:8px"><button class="btn2" type="button" id="fotoBajar">Descargar foto</button><button class="btn2" type="button" id="fotoCerrar">Cerrar</button></div></div>
  </div></dialog>
  <nav id="tabs" role="tablist"></nav>
  <div class="filters" id="filters"></div>
  <main id="main"></main>
</div>

<script>
const CARGA = /*__CARGA__*/null;
const FORMS = [["ac", "Acuerdos comerciales"], ["vis", "Visibilidad"], ["pr", "Promociones"], ["ex", "Exhibiciones ganadas"],
  ["sos", "SOS percha"], ["pl", "Planes comerciales"], ["co", "Check outs"], ["kb", "KBDS"]];
const RECARGA_MIN = 2;  // cada cuantos minutos se revisa si hay datos nuevos

let D = null;
let CLAVE = "";  // la de la página; también abre las fotos
const st = { tab: "ac", per: {}, acu: "", sup: "", can: "", zon: "", cad: "", neg: "", cat: "", q: "", vista: "zon", ver: "falta", dim: "cat",
  exVista: "res", exVer: "act", abiertos: new Set(), limit: 100 };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n.toLocaleString("es-EC");
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fdate = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}/${m}`; };
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* ---------- acceso ---------- */
async function descifrar(c, clave) {
  const b = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(c.sal), iterations: c.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(c.iv) }, key, b(c.datos))));
}

async function iniciar() {
  const t = store("seg-tema"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  if (!CARGA) { document.body.innerHTML = '<p class="empty">Plantilla vacía: ejecuta build_seguimiento.py.</p>'; return; }
  if (CARGA.plano) return arrancar(CARGA.plano);
  const guardada = store("seg-clave");
  if (guardada) { try { const d = await descifrar(CARGA.cifrado, guardada); CLAVE = guardada; return arrancar(d); } catch (e) { /* se pide de nuevo */ } }
  $("#lock").hidden = false; $("#lockPass").focus();
  $("#lockForm").addEventListener("submit", async ev => {
    ev.preventDefault(); $("#lockErr").textContent = "Verificando…";
    try { const clave = $("#lockPass").value; const d = await descifrar(CARGA.cifrado, clave); store("seg-clave", clave); CLAVE = clave; $("#lock").hidden = true; arrancar(d); }
    catch (e) { $("#lockErr").textContent = "Clave incorrecta."; }
  });
}

function arrancar(datos) {
  D = datos;
  for (const [k] of FORMS) {
    const f = D.formularios[k];
    if (!f) continue;
    f.key = k;
    f.filas.forEach(r => { r.neg = r.neg || []; r.cat = r.cat || []; r._q = norm([r.loc, r.id, r.lid, r.can, r.cad, r.zon, r.tipo, r.mer, r.sup, r.acu, ...r.neg, ...r.cat, ...(r.skus || [])].join(" ")); });
    st.per[k] = f.periodos[0]?.id;
  }
  // Una página generada antes de agregar un formulario no trae su pestaña.
  for (let i = FORMS.length - 1; i >= 0; i--) if (!D.formularios[FORMS[i][0]]) FORMS.splice(i, 1);
  restaurar();
  $("#app").hidden = false;
  $("#themeBtn").onclick = () => {
    const actual = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nuevo = actual === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = nuevo; store("seg-tema", nuevo);
  };
  render();
  reloj(); setInterval(reloj, 30000);
  setInterval(buscarNuevos, RECARGA_MIN * 60000);
  prepararActualizar();
}

/* ---------- botón Actualizar ---------- */
// Lanza el workflow "Actualizar seguimiento" con la API de GitHub. El token se
// guarda solo en el navegador de quien lo pega; nunca va dentro de la página.
const GH = location.hostname.endsWith(".github.io")
  ? { repo: `${location.hostname.split(".")[0]}/${location.pathname.split("/")[1]}`, wf: "actualizar.yml" } : null;

function prepararActualizar() {
  if (!GH) return;
  $("#actBtn").hidden = false;
  $("#actBtn").onclick = actualizarAhora;
  const e = esperando();
  if (e && e.ver !== D.actualizado) { sessionStorage.removeItem("seg-esperando"); msgAct("✓ Datos actualizados"); setTimeout(() => msgAct(""), 8000); }
  else if (e) esperarDatos();
}
function esperando() { try { return JSON.parse(sessionStorage.getItem("seg-esperando") || "null"); } catch (e) { return null; } }

function msgAct(txt, err) { $("#actMsg").textContent = txt; $("#actMsg").className = err ? "err" : ""; }

function pedirToken() {
  return new Promise(res => {
    const dlg = $("#tokDlg");
    $("#tokIn").value = "";
    dlg.onclose = () => res(dlg.returnValue === "si" ? $("#tokIn").value.trim() : null);
    dlg.showModal();
  });
}

async function corridaEnCurso() {
  try {
    const r = await (await fetch(`https://api.github.com/repos/${GH.repo}/actions/workflows/${GH.wf}/runs?per_page=5`, { cache: "no-store" })).json();
    return (r.workflow_runs || []).some(x => x.status === "queued" || x.status === "in_progress");
  } catch (e) { return false; }
}

async function actualizarAhora() {
  $("#actBtn").disabled = true;
  try {
    if (await corridaEnCurso()) return esperarDatos();
    let tok = store("seg-gh-token");
    if (!tok) { tok = await pedirToken(); if (!tok) return; }
    msgAct("Pidiendo actualización…");
    const r = await fetch(`https://api.github.com/repos/${GH.repo}/actions/workflows/${GH.wf}/dispatches`, {
      method: "POST",
      headers: { Authorization: `Bearer ${tok}`, Accept: "application/vnd.github+json" },
      body: JSON.stringify({ ref: "main" }),
    });
    if (r.status === 204) { store("seg-gh-token", tok); return esperarDatos(); }
    if (r.status === 401 || r.status === 403 || r.status === 404) {
      try { localStorage.removeItem("seg-gh-token"); } catch (e) {}
      msgAct("El token no es válido o no tiene permiso de Actions.", true);
    } else msgAct(`GitHub respondió ${r.status}. Intenta de nuevo.`, true);
  } catch (e) { msgAct("Sin conexión con GitHub.", true); }
  finally { if (!esperando()) $("#actBtn").disabled = false; }
}

// Revisa version.json cada 20 s; buscarNuevos recarga la página cuando cambia.
function esperarDatos() {
  const desde = esperando()?.desde || Date.now();
  if (Date.now() - desde > 10 * 60000) { sessionStorage.removeItem("seg-esperando"); $("#actBtn").disabled = false; return; }
  try { sessionStorage.setItem("seg-esperando", JSON.stringify({ desde, ver: D.actualizado })); } catch (e) {}
  $("#actBtn").disabled = true;
  msgAct("Actualizando… tarda unos 3 minutos");
  const t = setInterval(() => {
    if (Date.now() - desde > 10 * 60000) {
      clearInterval(t); sessionStorage.removeItem("seg-esperando");
      $("#actBtn").disabled = false; msgAct("Aún no llegan datos nuevos. Revisa Actions en GitHub.", true);
      return;
    }
    buscarNuevos();
  }, 20000);
}

/* ---------- actualización automática ---------- */
function reloj() {
  const min = Math.max(0, Math.round((Date.now() - new Date(D.actualizado)) / 60000));
  const hora = new Date(D.actualizado).toLocaleTimeString("es-EC", { hour: "2-digit", minute: "2-digit" });
  $("#upd").textContent = `Datos de las ${hora} · ${min < 1 ? "recién actualizado" : min < 60 ? `hace ${min} min` : `hace ${Math.round(min / 60)} h`}`;
}

// En GitHub Pages hay un version.json junto a la página; si cambió, se recarga
// conservando pestaña y filtros. Abierta como archivo local no hace nada.
async function buscarNuevos() {
  if (location.protocol === "file:") return;
  try {
    const v = await (await fetch("version.json?t=" + Date.now(), { cache: "no-store" })).json();
    if (v.actualizado && v.actualizado !== D.actualizado) { guardarEstado(); location.reload(); }
  } catch (e) { /* sin conexión: se reintenta en el próximo ciclo */ }
}
function guardarEstado() {
  try { sessionStorage.setItem("seg-estado", JSON.stringify({ ...st, abiertos: [...st.abiertos] })); } catch (e) {}
}
function restaurar() {
  try {
    const s = JSON.parse(sessionStorage.getItem("seg-estado") || "null");
    if (s) { Object.assign(st, s, { abiertos: new Set(s.abiertos || []) }); sessionStorage.removeItem("seg-estado"); }
  } catch (e) {}
  for (const [k] of FORMS) { const f = D.formularios[k]; if (!f.periodos.some(p => p.id === st.per[k])) st.per[k] = f.periodos[0]?.id; }
}

/* ---------- datos ---------- */
// Tres estados para la vista: subió sin novedad, subió con novedad, le falta.
const subido = r => r.e === "ok" || r.e === "nov";
const falta = r => r.e === "pen" || r.e === "no";

// Filas de un periodo con los filtros aplicados (per = semana o mes).
function filasPeriodo(f, per = st.per[f.key]) {
  if (f.key === "ex") { const w = semanaEx(per); return exFiltro(f).filter(r => r.alta <= w.fin && (!r.baja || r.baja >= w.ini)); }
  const q = norm(st.q).trim();
  const acu = f.key === "ac" ? st.acu : "";
  return f.filas.filter(r => r.p === per && r.e !== "prog" && (!acu || r.acu === acu) && (!st.sup || r.sup === st.sup) &&
    (!st.zon || r.zon === st.zon) && (!st.cad || r.cad === st.cad) && (!f.can_titulo || !st.can || r.can === st.can) &&
    (!st.neg || r.neg.includes(st.neg)) && (!st.cat || r.cat.includes(st.cat)) && (!q || r._q.includes(q)));
}

function contar(rs) {
  const c = { tot: rs.length, ok: 0, nov: 0, falta: 0 };
  for (const r of rs) { if (r.e === "ok") c.ok++; else if (r.e === "nov") c.nov++; else if (falta(r)) c.falta++; }
  c.sub = c.ok + c.nov; c.pct = c.tot ? Math.round(100 * c.sub / c.tot) : 0;
  return c;
}

function track(c) { return `<div class="track">${c.ok ? `<i class="i-ok" style="flex:${c.ok}"></i>` : ""}${c.nov ? `<i class="i-nov" style="flex:${c.nov}"></i>` : ""}<i style="flex:${c.falta || (c.tot ? 0 : 1)}"></i></div>`; }

function tag(r) {
  if (r.e === "ok") return '<span class="tag t-ok"><span class="ic">✓</span>Subido</span>';
  if (r.e === "nov") return '<span class="tag t-nov"><span class="ic">!</span>Subido con novedad</span>';
  return `<span class="tag t-falta"><span class="ic">✕</span>${r.e === "no" ? "No subió" : "Falta subir"}</span>`;
}

function nombreLocal(f, r) { return `${esc(r.loc)}<div class="sub">${esc(f.key === "ac" ? r.acu : [r.can, r.cad, r.zon].filter(Boolean).join(" · "))}</div>`; }

/* ---------- render ---------- */
function render() {
  $("#tabs").innerHTML = FORMS.map(([k, t]) => `<button role="tab" data-tab="${k}" aria-selected="${st.tab === k}">${t}</button>`).join("");
  const f = D.formularios[st.tab];
  renderFiltros(f);
  renderMain(f);
}

function renderFiltros(f) {
  const base = filasBase(f);
  const uniq = (rs, k) => [...new Set(rs.flatMap(r => r[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
  const opt = (lista, actual, todos) => `<option value="">${todos}</option>` + lista.map(v => `<option${v === actual ? " selected" : ""}>${esc(v)}</option>`).join("");
  // Las encuestas mensuales llevan sus filtros dentro de la mini pestaña Faltantes.
  const mens = MENSUALES.includes(f.key);
  $("#filters").style.display = mens ? "none" : "";
  if (mens) {
    for (const k of ["acu", "sup", "neg", "cat"]) st[k] = "";
    if (!f.can_titulo || !uniq(base, "can").includes(st.can)) st.can = "";
    if (!uniq(base, "zon").includes(st.zon)) st.zon = "";
    if (!uniq(base, "cad").includes(st.cad)) st.cad = "";
    return;
  }
  const ex = f.key === "ex";
  // Un filtro elegido en otra pestaña que aquí no existe se suelta.
  const propios = f.key === "ac" ? ["acu"] : [];
  if (ex || f.can_titulo) propios.push("can");
  if (!ex) propios.push("zon");
  for (const k of [...propios, "cad", "sup", "neg", "cat"]) if (st[k] && !uniq(base, k).includes(st[k])) st[k] = "";
  if (!propios.includes("can")) st.can = "";
  if (!propios.includes("zon")) st.zon = "";
  // Cadena depende de zona y del canal/plan elegidos.
  const paraCad = base.filter(r => (!st.can || r.can === st.can) && (!st.zon || r.zon === st.zon));
  const negs = uniq(base, "neg");
  $("#filters").innerHTML = `
    ${f.key === "ac" ? `<select data-f="acu" aria-label="Acuerdo">${opt(uniq(base, "acu"), st.acu, "Todos los acuerdos")}</select>` : ""}
    ${ex || f.can_titulo ? `<select data-f="can" aria-label="Canal">${opt(uniq(base, "can"), st.can, f.can_titulo || "Todos los canales")}</select>` : ""}
    ${ex ? "" : `<select data-f="zon" aria-label="Zona">${opt(uniq(base.filter(r => !st.can || r.can === st.can), "zon"), st.zon, "Todas las zonas")}</select>`}
    <select data-f="cad" aria-label="Cadena o cliente">${opt(uniq(paraCad, "cad"), st.cad, ex ? "Todas las cadenas" : "Todas las cadenas / clientes")}</select>
    <select data-f="sup" aria-label="Supervisor">${opt(uniq(base, "sup"), st.sup, "Todos los supervisores")}</select>
    ${negs.length ? `<select data-f="neg" aria-label="Negocio">${opt(negs, st.neg, "Todos los negocios")}</select>
    <select data-f="cat" aria-label="Categoría">${opt(uniq(base.filter(r => !st.neg || r.neg.includes(st.neg)), "cat"), st.cat, "Todas las categorías")}</select>` : ""}
    <input type="search" data-f="q" placeholder="Buscar local, mercaderista…" value="${esc(st.q)}">
    ${st.acu || st.can || st.zon || st.cad || st.sup || st.neg || st.cat || st.q ? '<button class="clear" data-f="clear" type="button">Limpiar</button>' : ""}`;
}

// Filas del periodo sin los filtros de persona/negocio (para llenar las listas).
const FILTROS = ["acu", "can", "zon", "cad", "sup", "neg", "cat", "q"];
function filasBase(f) { const g = {}; for (const k of FILTROS) { g[k] = st[k]; st[k] = ""; } const rs = filasPeriodo(f); Object.assign(st, g); return rs; }

function renderMain(f) {
  if (f.key === "ex") return renderEx(f);
  if (MENSUALES.includes(f.key)) return renderMensual(f);
  const rs = filasPeriodo(f);
  const c = contar(rs);
  const unidad = f.key === "ac" ? "acuerdos" : f.unidad || "locales";
  const avance = `<section class="avance">
    <div class="big">${c.pct}%<small>subido</small></div>
    <div class="bar">${track(c)}<div class="sub" style="margin-top:6px"><b>${esc(f.periodos.find(p => p.id === st.per[f.key])?.label || "")}</b> · ${fmt(c.sub)} de ${fmt(c.tot)} ${unidad}</div></div>
    <div class="nums">
      <span><b class="falta-n">${fmt(c.falta)}</b>Faltan</span>
      <span><b>${fmt(c.ok)}</b>Subidos</span>
      <span><b>${fmt(c.nov)}</b>Con novedad</span>
    </div></section>`;

  const grp = GRUPOS.find(([k]) => k === st.vista);
  const cuerpo = grp ? porGrupo(f, rs, grp) : porLocal(f, rs, c);
  const btn = (k, t) => `<button type="button" data-vista="${k}" aria-pressed="${st.vista === k}">${t}</button>`;
  $("#main").innerHTML = franjaPeriodos(f) + avance + `<section class="card">
    <div class="card-head">
      <h2>¿Qué falta subir?</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="seg" role="group">${GRUPOS.map(([k, , t]) => btn(k, "Por " + t)).join("")}${btn("loc", "Por local")}</div>
        <button class="btn2" type="button" data-csv>Descargar</button>
      </div>
    </div>${cuerpo}</section>`;
}

// Avance de cada semana (o mes) con los filtros actuales; tocar una la abre.
function franjaPeriodos(f) {
  const semana = f.periodo_tipo === "semana";
  const items = f.periodos.slice().reverse().map((p, i, arr) => {
    const c = contar(filasPeriodo(f, p.id));
    const actual = i === arr.length - 1;
    const corto = semana ? "Semana " + (p.label.match(/^Semana (\d+)/) || [])[1] : p.label;
    const rango = semana ? p.label.split("·")[1]?.trim() : "";
    return `<button type="button" class="per-btn" data-per="${esc(p.id)}" aria-pressed="${p.id === st.per[f.key]}">
      <span class="per-n">${esc(corto)}${actual ? ' <span class="en-curso">en curso</span>' : ""}</span>
      <span class="per-r">${esc(rango)}</span>
      <span class="per-p ${c.tot && c.pct < 50 && !actual ? "bajo" : ""}">${c.tot ? c.pct + "%" : "—"}</span>
      ${track(c)}<span class="per-r">${c.tot ? `${fmt(c.falta)} faltan` : "sin datos"}</span></button>`;
  }).join("");
  return `<section class="periodos" aria-label="Avance por ${semana ? "semana" : "mes"}">${items}</section>`;
}

const sinPersona = n => /^sin (alcance|asignar)/i.test(n) ? 1 : 0;

/* ---------- SOS, planes, check outs y KBDS ---------- */
// Tarjetas de resumen y dos mini pestañas: Avance (barras por zona, cadena y
// plan o canal) y Faltantes (lista filtrable para mandar al grupo).
const MENSUALES = ["sos", "pl", "co", "kb"];
const PIL_M = { ok: ["subida", "Subido"], nov: ["nov", "Con novedad"], pen: ["falta", "Falta"], no: ["falta", "No subió"] };
const ESTADOS_M = [["falta", "Solo faltantes"], ["", "Todos"], ["subida", "Solo subidos"], ["nov", "Con novedad"]];
const canNombre = f => f.key === "pl" ? "plan" : "canal";
const cadNombre = f => f.key === "pl" || f.key === "co" ? "cliente" : "cadena";
const colsM = f => [["id", "Código"], ["loc", "Local"], ["cad", cadNombre(f)], ...(f.can_titulo ? [["can", canNombre(f)]] : []),
  ["obj", f.key === "co" ? "Percha" : "Formato"], ["zon", "Zona"], ["e", "Estado"], ["f", "Visita"], ["mer", "Quién"]];
const horaDatos = () => new Date(D.actualizado).toLocaleString("es-EC", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const periodoM = f => f.periodos.find(p => p.id === st.per[f.key])?.label || "";

// Corre fn sin los filtros de Faltantes (las tarjetas y Avance son del mes completo).
function sinFiltros(fn) { const g = {}; for (const k of FILTROS) { g[k] = st[k]; st[k] = ""; } try { return fn(); } finally { Object.assign(st, g); } }

function agrupar(rs, campo) {
  const m = new Map();
  for (const r of rs) { const k = r[campo] || "Sin asignar"; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  return m;
}

function filasFaltantes(f) {
  const q = norm(st.q).trim();
  const est = st.mEst ?? "falta";
  const pasa = { falta, subida: r => r.e === "ok", nov: r => r.e === "nov" }[est] || (() => true);
  const o = st.mOrd || { c: "zon", asc: true };
  const val = r => o.c === "e" ? PIL_M[r.e]?.[1] : o.c === "mer" ? (r.por || r.mer) : r[o.c];
  return filasBase(f).filter(r => (!st.zon || r.zon === st.zon) && (!st.cad || r.cad === st.cad) && (!st.can || r.can === st.can) &&
      pasa(r) && (!q || r._q.includes(q)))
    .sort((a, b) => (o.asc ? 1 : -1) * String(val(a) || "").localeCompare(String(val(b) || ""), "es", { numeric: true }) || a.loc.localeCompare(b.loc, "es"));
}

function barrasM(rs, campo) {
  return [...agrupar(rs, campo)].map(([k, l]) => ({ k, c: contar(l) }))
    .sort((a, b) => b.c.pct - a.c.pct || b.c.tot - a.c.tot || a.k.localeCompare(b.k, "es"))
    .map(({ k, c }) => `<button type="button" class="m-barra" data-mir="${campo}" data-val="${esc(k)}" title="${esc(k)}: ${fmt(c.sub)} de ${fmt(c.tot)} · faltan ${fmt(c.falta)}. Toca para ver lo que falta.">
      <span class="nom">${esc(k)}</span>
      <span class="m-pista">${c.ok ? `<i class="s" style="width:${(100 * c.ok / c.tot).toFixed(2)}%"></i>` : ""}${c.nov ? `<i class="n" style="width:${(100 * c.nov / c.tot).toFixed(2)}%"></i>` : ""}</span>
      <span class="cif"><b>${fmt(c.sub)}</b>/${fmt(c.tot)} · ${c.pct}%</span></button>`).join("");
}

function renderMensual(f) {
  st.mSub = st.mSub || "avance";
  const rs = filasBase(f), c = contar(rs);
  const tarjetas = [["azul", fmt(c.tot), "Objetivo"], ["ok", fmt(c.ok), "Subidos"], ["medio", fmt(c.nov), "Con novedad"],
    ["falta", fmt(c.falta), "Faltan"], ["azul", (c.tot ? (100 * c.sub / c.tot).toFixed(1) : "0.0") + "%", "Avance"]]
    .map(([k, v, t]) => `<div class="m-t ${k}"><b>${v}</b><span>${t}</span></div>`).join("");
  const nav = [["avance", "Avance"], ["faltantes", "Faltantes"]]
    .map(([k, t]) => `<button type="button" data-msub="${k}" class="${st.mSub === k ? "on" : ""}">${t}</button>`).join("");
  const nota = "Verde: subidos. Ámbar: subidos con novedad. Toca una barra para ver lo que falta.";
  const caja = (titulo, txt, campo) => `<div class="m-caja"><h2>${titulo}</h2><p class="nota">${txt}</p>${barrasM(rs, campo)}</div>`;
  let cuerpo;
  if (st.mSub === "avance") {
    cuerpo = (f.can_titulo ? caja(`Avance por ${canNombre(f)}`, nota, "can") : "") +
      caja("Avance por zona", nota, "zon") + caja(`Avance por ${cadNombre(f)}`, f.can_titulo ? "Toca una barra para ver lo que falta." : nota, "cad");
  } else {
    const uniq = (xs, k) => [...new Set(xs.map(r => r[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
    const opt = (lista, actual, todos) => `<option value="">${todos}</option>` + lista.map(v => `<option${v === actual ? " selected" : ""}>${esc(v)}</option>`).join("");
    const deCan = rs.filter(r => !st.can || r.can === st.can);
    const o = st.mOrd || { c: "zon", asc: true };
    const est = st.mEst ?? "falta";
    cuerpo = `<div class="m-caja"><h2>${est === "falta" ? "Locales que faltan" : "Locales"}</h2>
      <div class="m-mandos">
        ${f.can_titulo ? `<select data-m="can" aria-label="${canNombre(f)}">${opt(uniq(rs, "can"), st.can, f.can_titulo)}</select>` : ""}
        <select data-m="zon" aria-label="Zona">${opt(uniq(deCan, "zon"), st.zon, "Todas las zonas")}</select>
        <select data-m="cad" aria-label="${cadNombre(f)}">${opt(uniq(deCan.filter(r => !st.zon || r.zon === st.zon), "cad"), st.cad, f.key === "pl" || f.key === "co" ? "Todos los clientes" : "Todas las cadenas")}</select>
        <select data-m="est" aria-label="Estado">${ESTADOS_M.map(([k, t]) => `<option value="${k}"${k === est ? " selected" : ""}>${t}</option>`).join("")}</select>
        <input type="text" data-m="q" placeholder="Buscar local, código o mercaderista…" value="${esc(st.q)}">
        <span class="m-sello" id="mCuenta"></span>
      </div>
      <div class="m-mandos">
        <button class="m-btn claro" type="button" data-macc="img">🖼️ Generar imagen de la lista</button>
        <input type="tel" id="mWa" placeholder="593991234567" size="15" value="${esc(store("seg-wa") || "")}">
        <button class="m-btn wa" type="button" data-macc="wa">Enviar por WhatsApp</button>
        <button class="m-btn claro" type="button" data-macc="copiar">Copiar lista</button>
        <button class="m-btn claro" type="button" data-csv>Descargar Excel</button>
      </div>
      <div class="m-scroll"><table><thead><tr>${colsM(f).map(([k, t]) => `<th data-mord="${k}">${esc(t)}${o.c === k ? (o.asc ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>
        <tbody id="mCuerpo"></tbody></table></div>
      <div id="mLienzo"></div></div>`;
  }
  $("#main").innerHTML = sinFiltros(() => franjaPeriodos(f)) + `<div class="mref">
    <div class="m-tarjetas">${tarjetas}</div>
    <nav class="m-nav" aria-label="Vista">${nav}</nav>
    <section class="m-sec">${cuerpo}</section></div>`;
  if (st.mSub === "faltantes") pintarFaltantes(f, rs.length);
}

function pintarFaltantes(f, total) {
  const rs = filasFaltantes(f);
  $("#mCuenta").textContent = `${fmt(rs.length)} de ${fmt(total ?? filasBase(f).length)}`;
  const n = colsM(f).length;
  $("#mCuerpo").innerHTML = rs.length ? rs.map(r => { const [cls, txt] = PIL_M[r.e] || ["falta", "Falta"]; return `<tr>
    <td>${esc(r.id)}</td><td>${esc(r.loc)}</td><td>${esc(r.cad)}</td>${f.can_titulo ? `<td>${esc(r.can)}</td>` : ""}
    <td>${esc(r.obj)}</td><td style="white-space:nowrap">${esc(r.zon)}</td>
    <td><span class="m-pil ${cls}">${txt}</span>${r.e === "nov" ? r.nov.map(x => `<div class="m-nov">${esc(x)}</div>`).join("") : ""}</td>
    <td>${fdate(r.f) || "—"}</td><td>${esc(r.por || r.mer)}</td></tr>`; }).join("")
    : `<tr><td colspan="${n}" class="m-vacio">Nada con esos filtros.</td></tr>`;
}

// Lista agrupada por zona, para copiar o mandar por WhatsApp.
function textoFaltantes(f) {
  const rs = filasFaltantes(f);
  const falt = (st.mEst ?? "falta") === "falta";
  const extra = [st.can, st.cad].filter(Boolean).join(" · ");
  let out = `*${falt ? "Locales que faltan subir" : "Locales"} · ${st.zon || "todas las zonas"}*\n_${f.titulo}${extra ? " · " + extra : ""} · ${periodoM(f)} · datos al ${horaDatos()}_\n`;
  for (const [z, l] of [...agrupar(rs, "zon")].sort((a, b) => a[0].localeCompare(b[0], "es"))) {
    out += `\n*${z}* (${l.length})\n`;
    for (const r of l) out += `• ${r.loc} — ${r.cad}\n`;
  }
  return out + `\nTotal: ${rs.length} locales.`;
}

// Imagen de la lista dibujada en un canvas, para mandar al grupo.
function imagenFaltantes(f) {
  const rs = filasFaltantes(f);
  if (!rs.length) { alert("No hay locales con esos filtros."); return; }
  const grupos = [...agrupar(rs, "zon")].sort((a, b) => a[0].localeCompare(b[0], "es"));
  const AN = 900, PAD = 34, LH = 26;
  let alto = PAD * 2 + 86 + 34;
  for (const [, l] of grupos) alto += 38 + l.length * LH;
  const cv = document.createElement("canvas");
  const k = window.devicePixelRatio > 1 ? 2 : 1;
  cv.width = AN * k; cv.height = alto * k; cv.style.width = AN + "px";
  const g = cv.getContext("2d");
  g.scale(k, k);
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, AN, alto);
  g.fillStyle = "#1a73e8"; g.fillRect(0, 0, AN, 6);
  const fuente = (peso, px) => `${peso} ${px}px Segoe UI, system-ui, sans-serif`;
  const corta = (t, ancho) => { let s = String(t || ""); if (g.measureText(s).width <= ancho) return s; while (s.length > 3 && g.measureText(s + "…").width > ancho) s = s.slice(0, -1); return s.replace(/[ (,·-]+$/, "") + "…"; };
  let y = PAD + 20;
  g.fillStyle = "#14181d"; g.font = fuente(700, 25);
  g.fillText(((st.mEst ?? "falta") === "falta" ? "Locales que faltan subir" : "Locales") + (st.zon ? " · " + st.zon : ""), PAD, y);
  y += 26;
  g.fillStyle = "#5f6872"; g.font = fuente(400, 14);
  const total = sinFiltros(() => filasBase(f).length);
  g.fillText(corta(`${f.titulo}${st.can ? " · " + st.can : ""}${st.cad ? " · " + st.cad : ""} · ${periodoM(f)} · datos al ${horaDatos()} · ${rs.length} de ${total} del objetivo`, AN - 2 * PAD), PAD, y);
  y += 30;
  for (const [z, l] of grupos) {
    g.fillStyle = "#f5f7f9"; g.fillRect(PAD - 10, y - 4, AN - 2 * (PAD - 10), 26);
    g.fillStyle = "#1a73e8"; g.font = fuente(700, 15);
    g.fillText(`${z}  (${l.length})`, PAD, y + 14);
    y += 36;
    g.font = fuente(400, 14);
    for (const r of l) {
      g.fillStyle = "#9aa3ad"; g.fillText("•", PAD + 4, y + 13);
      g.fillStyle = "#14181d"; g.fillText(corta(r.loc, AN - 2 * PAD - 330), PAD + 20, y + 13);
      g.fillStyle = "#5f6872"; g.fillText(corta(r.cad, 190), AN - PAD - 290, y + 13);
      g.fillStyle = "#9aa3ad"; g.fillText(corta(r.id, 80), AN - PAD - 80, y + 13);
      y += LH;
    }
  }
  g.fillStyle = "#9aa3ad"; g.font = fuente(400, 12);
  g.fillText("Industrias Ales · generado desde el tablero de seguimiento", PAD, alto - PAD + 8);
  const caja = $("#mLienzo");
  caja.innerHTML = "";
  caja.appendChild(cv);
  const b = document.createElement("button");
  b.className = "m-btn"; b.type = "button"; b.style.marginTop = "10px"; b.textContent = "⬇️ Descargar la imagen";
  b.onclick = () => cv.toBlob(blob => {
    const u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = u; a.download = `Faltantes-${f.titulo}${st.zon ? "-" + st.zon : ""}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 10000);
  }, "image/png");
  caja.appendChild(document.createElement("br"));
  caja.appendChild(b);
  cv.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

document.addEventListener("change", ev => {
  const k = ev.target.dataset?.m; if (!k || k === "q") return;
  const f = D.formularios[st.tab];
  if (k === "est") st.mEst = ev.target.value;
  else { st[k] = ev.target.value; if (k === "can") st.zon = st.cad = ""; if (k === "zon") st.cad = ""; }
  renderMain(f);
});
let tqM;
document.addEventListener("input", ev => {
  if (ev.target.dataset?.m !== "q") return;
  clearTimeout(tqM); tqM = setTimeout(() => { st.q = ev.target.value; pintarFaltantes(D.formularios[st.tab]); }, 200);
});
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-msub],[data-mir],[data-mord],[data-macc]"); if (!t) return;
  const f = D.formularios[st.tab], d = t.dataset;
  if (d.msub) { st.mSub = d.msub; renderMain(f); return; }
  if (d.mir) { st.can = st.zon = st.cad = ""; st[d.mir] = d.val; st.mEst = "falta"; st.mSub = "faltantes"; renderMain(f); window.scrollTo({ top: $(".m-nav").offsetTop - 8, behavior: "smooth" }); return; }
  if (d.mord) { const o = st.mOrd || { c: "zon", asc: true }; st.mOrd = { c: d.mord, asc: o.c === d.mord ? !o.asc : true }; renderMain(f); return; }
  if (d.macc === "img") imagenFaltantes(f);
  if (d.macc === "copiar") {
    try { await navigator.clipboard.writeText(textoFaltantes(f)); t.textContent = "✓ Copiada"; }
    catch (e) { t.textContent = "No se pudo copiar"; }
    setTimeout(() => { t.textContent = "Copiar lista"; }, 1800);
  }
  if (d.macc === "wa") {
    const n = $("#mWa").value.replace(/[^0-9]/g, "");
    if (n.length < 10) { alert("Pon el número con código de país, sin + ni espacios. Ej: 593991234567"); return; }
    const txt = textoFaltantes(f);
    if (txt.length > 1800 && !confirm(`La lista es larga (${txt.length} caracteres) y WhatsApp puede cortarla.\n\nMejor filtra por zona y manda la imagen. ¿Abro igual?`)) return;
    store("seg-wa", n);
    window.open("https://wa.me/" + n + "?text=" + encodeURIComponent(txt), "_blank");
  }
});

// Agrupaciones de «¿Qué falta subir?»: [clave en st.vista, campo de la fila, nombre].
const GRUPOS = [["zon", "zon", "zona"], ["cad", "cad", "cadena / cliente"], ["per", "mer", "mercaderista"]];

function porGrupo(f, rs, [vista, campo, nombre]) {
  const m = new Map();
  for (const r of rs) { const k = r[campo] || "Sin asignar"; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  const grupos = [...m].map(([mer, lista]) => ({ mer, lista, c: contar(lista),
    sup: campo === "mer" ? lista[0].sup : campo === "cad" ? [...new Set(lista.map(r => r.zon))].join(", ") : (n => `${n} ${n === 1 ? "cadena / cliente" : "cadenas / clientes"}`)(new Set(lista.map(r => r.cad)).size) }))
    // Los grupos sin persona real («Sin Alcance», «Sin asignar») van al final.
    .sort((a, b) => sinPersona(a.mer) - sinPersona(b.mer) || b.c.falta - a.c.falta || a.c.pct - b.c.pct || a.mer.localeCompare(b.mer, "es"));
  if (!grupos.length) return '<p class="empty">No hay nada con estos filtros.</p>';
  const filas = grupos.map(g => {
    const llave = `${vista}:${g.mer}`;
    const abierto = st.abiertos.has(llave);
    let det = "";
    if (abierto) {
      const faltan = g.lista.filter(falta).sort((a, b) => a.loc.localeCompare(b.loc, "es"));
      const subidos = g.lista.filter(subido).sort((a, b) => (b.e === "nov") - (a.e === "nov") || (b.f || "").localeCompare(a.f || ""));
      det = `<tr class="det"><td colspan="4"><div class="cols">
        <div><h3><span class="tag t-falta"><span class="ic">✕</span></span>Falta subir (${faltan.length})</h3>
          ${faltan.length ? `<ul>${faltan.map(r => `<li>${nombreLocal(f, r)}${campo !== "mer" ? `<div class="sub">${esc(r.mer)}</div>` : ""}</li>`).join("")}</ul>` : '<p class="vacio">Nada pendiente 🎉</p>'}</div>
        <div><h3><span class="tag t-ok"><span class="ic">✓</span></span>Ya subió (${subidos.length})</h3>
          ${subidos.length ? `<ul>${subidos.map(r => `<li>${nombreLocal(f, r)}<div class="sub">${fdate(r.f)}${r.e === "nov" ? ' · <span class="tag t-nov">con novedad</span>' : ""}</div>${r.e === "nov" && r.nov[0] ? `<div class="nov-txt">${esc(r.nov[0])}${r.nov.length > 1 ? ` (+${r.nov.length - 1})` : ""}</div>` : ""}</li>`).join("")}</ul>` : '<p class="vacio">Todavía no ha subido nada.</p>'}</div>
      </div></td></tr>`;
    }
    return `<tr class="persona${abierto ? " open" : ""}" data-mer="${esc(llave)}">
      <td><span class="caret">▸</span>${esc(g.mer)}<div class="sub" style="margin-left:14px">${esc(g.sup)}</div></td>
      <td class="n">${g.c.falta ? `<span class="falta-n">${fmt(g.c.falta)}</span>` : '<span class="cero">0</span>'}</td>
      <td class="n">${fmt(g.c.sub)}${g.c.nov ? `<div class="sub">${fmt(g.c.nov)} con novedad</div>` : ""}</td>
      <td class="n hide-sm"><span class="mini">${track(g.c)}</span>${g.c.pct}%</td></tr>${det}`;
  }).join("");
  return `<div class="tbl"><table>
    <thead><tr><th>${esc(nombre[0].toUpperCase() + nombre.slice(1))}</th><th class="n">Falta subir</th><th class="n">Ya subió</th><th class="n hide-sm">Avance</th></tr></thead>
    <tbody>${filas}</tbody></table></div>
    <p class="sub" style="margin:10px 0 0">Toca una fila para ver qué falta y qué ya se subió.</p>`;
}

function porLocal(f, rs, c) {
  const filtro = { falta, subido: r => r.e === "ok", nov: r => r.e === "nov" }[st.ver];
  const lista = rs.filter(filtro).sort((a, b) => a.mer.localeCompare(b.mer, "es") || a.loc.localeCompare(b.loc, "es"));
  const chip = (k, t, n) => `<button class="chip" type="button" data-ver="${k}" aria-pressed="${st.ver === k}">${t} <b>${fmt(n)}</b></button>`;
  const filas = lista.slice(0, st.limit).map(r => `<tr>
    <td>${nombreLocal(f, r)}</td><td>${tag(r)}${r.e === "nov" ? r.nov.map(n => `<div class="nov-txt">${esc(n)}</div>`).join("") : ""}</td>
    <td>${esc(r.mer)}<div class="sub">${esc(r.sup)}</div></td><td class="n">${fdate(r.f) || "—"}</td></tr>`).join("");
  return `<div class="chips">${chip("falta", "Falta subir", c.falta)}${chip("subido", "Subido", c.ok)}${chip("nov", "Con novedad", c.nov)}</div>
    ${lista.length ? `<div class="tbl"><table><thead><tr><th>${f.key === "ac" ? "Local / acuerdo" : "Local"}</th><th>Estado</th><th>Mercaderista</th><th class="n">Fecha</th></tr></thead><tbody>${filas}</tbody></table></div>
    ${lista.length > st.limit ? `<button class="btn2 more" type="button" data-more>Ver más (${fmt(lista.length - st.limit)} restantes)</button>` : ""}` : '<p class="empty">Nada en esta lista.</p>'}`;
}

/* ---------- exhibiciones ganadas ---------- */
// Una exhibición está activa desde su alta hasta que se registra su baja: si
// esa semana no suben encuesta, sigue contando como activa.
const DIA = 86400000;
const dias = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / DIA));
const nDias = n => `${fmt(n)} ${n === 1 ? "día" : "días"}`;
const prom = xs => xs.length ? Math.round(xs.reduce((s, x) => s + x, 0) / xs.length) : null;
const DIMS = [["can", "Canal"], ["neg", "Negocio"], ["cat", "Categoría"], ["skus", "SKU"], ["zon", "Zona"], ["cad", "Cadena"], ["tipo", "Tipo de exhibición"], ["loc", "Local"], ["mer", "Mercaderista"]];

// Semana lun-dom; si es la semana en curso, termina hoy.
function semanaEx(per) {
  const fin = new Date(new Date(per).getTime() + 6 * DIA).toISOString().slice(0, 10);
  return { ini: per, fin: fin < D.hoy ? fin : D.hoy };
}

function exFiltro(f) {
  const q = norm(st.q).trim();
  return f.filas.filter(r => (!st.can || r.can === st.can) && (!st.cad || r.cad === st.cad) && (!st.sup || r.sup === st.sup) && (!st.neg || r.neg.includes(st.neg)) &&
    (!st.cat || r.cat.includes(st.cat)) && (!q || r._q.includes(q)));
}

// rs = exhibiciones que estuvieron activas en algún momento de la semana w.
function medirEx(rs, w) {
  const activas = rs.filter(r => !r.baja || r.baja > w.fin);
  const perdidas = rs.filter(r => r.baja && r.baja <= w.fin);
  return {
    activas, perdidas,
    ganadas: rs.filter(r => r.alta >= w.ini),
    locales: new Set(activas.map(r => r.lid)).size,
    diasAct: prom(activas.map(r => dias(r.alta, w.fin))),
  };
}

function renderEx(f) {
  const per = st.per.ex, w = semanaEx(per);
  const rs = filasPeriodo(f), m = medirEx(rs, w);
  // Cuánto duran: todas las que se perdieron hasta esta semana.
  const duraron = prom(exFiltro(f).filter(r => r.baja && r.baja <= w.fin).map(r => dias(r.alta, r.baja)));
  const label = f.periodos.find(p => p.id === per)?.label || "";
  const d = n => n === null ? "—" : `${fmt(n)} <span style="font-size:13px;font-weight:500">${n === 1 ? "día" : "días"}</span>`;
  const resumen = `<section class="avance">
    <div class="big">${fmt(m.activas.length)}<small>activas</small></div>
    <div class="bar"><div class="sub"><b>${esc(label)}</b> · en ${fmt(m.locales)} ${m.locales === 1 ? "local" : "locales"}</div>
      <div class="sub" style="margin-top:4px">Una exhibición sigue activa hasta que se registra su baja.</div></div>
    <div class="nums">
      <span><b class="cero">+${fmt(m.ganadas.length)}</b>Ganadas</span>
      <span><b class="${m.perdidas.length ? "falta-n" : ""}">−${fmt(m.perdidas.length)}</b>Perdidas</span>
      <span><b>${d(m.diasAct)}</b>Llevan activas</span>
      <span><b>${d(duraron)}</b>Duran (perdidas)</span>
    </div></section>`;

  const vistas = `<div class="seg" role="group" style="margin-bottom:12px"><button type="button" data-exvista="res" aria-pressed="${st.exVista === "res"}">Resumen</button><button type="button" data-exvista="fotos" aria-pressed="${st.exVista === "fotos"}">Fotos</button></div>`;
  if (st.exVista === "fotos") { $("#main").innerHTML = franjaEx(f) + resumen + vistas + renderFotos(f, rs, m, w); cargarMiniaturas(); return; }

  const dim = st.dim, nombreDim = DIMS.find(x => x[0] === dim)[1];
  const grupos = new Map();
  for (const r of rs) for (const v of [].concat(r[dim] || "Sin dato")) { if (!grupos.has(v)) grupos.set(v, []); grupos.get(v).push(r); }
  const lista = [...grupos].map(([v, xs]) => ({ v, xs, m: medirEx(xs, w) }))
    .sort((a, b) => b.m.activas.length - a.m.activas.length || b.m.ganadas.length - a.m.ganadas.length || String(a.v).localeCompare(String(b.v), "es"));
  const filas = lista.map(gr => {
    const llave = `${dim}:${gr.v}`, abierto = st.abiertos.has(llave);
    const det = abierto ? `<tr class="det"><td colspan="5"><ul style="list-style:none;margin:0;padding:0">${gr.xs
      .sort((a, b) => (!!a.baja && a.baja <= w.fin) - (!!b.baja && b.baja <= w.fin) || b.alta.localeCompare(a.alta))
      .map(r => itemEx(r, w)).join("")}</ul></td></tr>` : "";
    return `<tr class="persona${abierto ? " open" : ""}" data-grp="${esc(llave)}">
      <td><span class="caret">▸</span>${esc(gr.v)}</td>
      <td class="n"><b>${fmt(gr.m.activas.length)}</b></td>
      <td class="n">${gr.m.ganadas.length ? `<span class="cero">+${fmt(gr.m.ganadas.length)}</span>` : "0"}</td>
      <td class="n">${gr.m.perdidas.length ? `<span class="falta-n">−${fmt(gr.m.perdidas.length)}</span>` : "0"}</td>
      <td class="n hide-sm">${gr.m.diasAct === null ? "—" : fmt(gr.m.diasAct)}</td></tr>${det}`;
  }).join("");
  const sel = `<select data-f="dim" aria-label="Agrupar por" style="background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 9px">${DIMS.map(([k, t]) => `<option value="${k}"${k === dim ? " selected" : ""}>Por ${t.toLowerCase()}</option>`).join("")}</select>`;
  $("#main").innerHTML = franjaEx(f) + resumen + vistas + `<section class="card">
    <div class="card-head"><h2>Exhibiciones por ${esc(nombreDim.toLowerCase())}</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${sel}<button class="btn2" type="button" data-csv>Descargar</button></div></div>
    ${lista.length ? `<div class="tbl"><table>
      <thead><tr><th>${esc(nombreDim)}</th><th class="n">Activas</th><th class="n">Ganadas</th><th class="n">Perdidas</th><th class="n hide-sm">Días activas (prom.)</th></tr></thead>
      <tbody>${filas}</tbody></table></div>
      <p class="sub" style="margin:10px 0 0">Ganadas y perdidas son de la semana elegida. Toca una fila para ver sus exhibiciones.${["neg", "cat", "skus"].includes(dim) ? " Una exhibición con varios productos cuenta en cada uno." : ""}</p>`
      : '<p class="empty">No hay exhibiciones en esta semana con estos filtros.</p>'}</section>`;
}

function itemEx(r, w) {
  const perdida = r.baja && r.baja <= w.fin;
  const estado = perdida
    ? `<span class="tag t-falta"><span class="ic">✕</span>Perdida el ${fdate(r.baja)}</span> · duró ${nDias(dias(r.alta, r.baja))}${r.mot ? ` · ${esc(r.mot)}` : ""}${r.com ? ` — ${esc(r.com)}` : ""}`
    : `<span class="tag t-ok"><span class="ic">✓</span>Activa</span> · lleva ${nDias(dias(r.alta, w.fin))}`;
  return `<li style="padding:7px 0;border-top:1px solid var(--grid)"><b>${esc(r.tipo)}</b> · ${esc(r.loc)} <span class="sub">${esc(r.zon)}</span>
    ${r.alta >= w.ini ? ' <span class="en-curso">nueva</span>' : ""}
    <div class="sub">${esc(r.skus.join(" + "))}</div>
    <div class="sub">Ganada el ${fdate(r.alta)} · ${esc(r.mer)}${r.vista && !perdida ? ` · última vez vista ${fdate(r.vista)}` : ""}</div>
    <div class="sub" style="margin-top:2px">${estado}</div></li>`;
}

function franjaEx(f) {
  const items = f.periodos.slice().reverse().map((p, i, arr) => {
    const w = semanaEx(p.id), m = medirEx(filasPeriodo(f, p.id), w);
    return `<button type="button" class="per-btn" data-per="${esc(p.id)}" aria-pressed="${p.id === st.per.ex}">
      <span class="per-n">Semana ${esc((p.label.match(/^Semana (\d+)/) || [])[1])}${i === arr.length - 1 ? ' <span class="en-curso">en curso</span>' : ""}</span>
      <span class="per-r">${esc(p.label.split("·")[1]?.trim() || "")}</span>
      <span class="per-p">${fmt(m.activas.length)}</span>
      <span class="per-r">activas · <span class="cero">+${fmt(m.ganadas.length)}</span> <span class="${m.perdidas.length ? "falta-n" : ""}">−${fmt(m.perdidas.length)}</span></span></button>`;
  }).join("");
  return `<section class="periodos" aria-label="Exhibiciones por semana">${items}</section>`;
}

/* ---------- fotos de exhibiciones ---------- */
// Las fotos viven en la rama «fotos» del repositorio: t/ = miniatura liviana,
// g/ = la foto original. Con clave van cifradas (12 bytes de IV + AES-GCM).
const VER_EX = [["act", "Activas"], ["nue", "Ganadas en la semana"], ["per", "Perdidas"], ["todas", "Todas"]];
const perdidaEn = (r, w) => !!r.baja && r.baja <= w.fin;

function fotosDe(rs, w, ver = st.exVer) {
  const filtro = { act: r => !perdidaEn(r, w), nue: r => r.alta >= w.ini, per: r => perdidaEn(r, w), todas: () => true }[ver];
  return rs.filter(filtro).sort((a, b) => a.cad.localeCompare(b.cad, "es") || a.zon.localeCompare(b.zon, "es") ||
    a.loc.localeCompare(b.loc, "es") || a.alta.localeCompare(b.alta));
}

// Fotos tomadas hasta el cierre de la semana. Se muestran la de cuando se
// ganó y la de seguimiento más reciente (se pide una si pasó una semana).
const fotosHasta = (r, w) => (r.fotos || []).filter(p => p.f <= w.fin);
function fotosClave(r, w) { const xs = fotosHasta(r, w); return xs.length > 1 ? [xs[0], xs[xs.length - 1]] : xs; }
const etiquetaFoto = p => `${p.s ? "Seguimiento" : "Ganada"} ${fdate(p.f)}`;

function badgeEx(r, w) {
  if (perdidaEn(r, w)) return ["PERDIDA", "b-per", "B88600"];
  if (r.alta >= w.ini) return ["NUEVA", "b-nue", "2A78D6"];
  return ["ACTIVA", "b-act", "1E7D3A"];
}

function renderFotos(f, rs, m, w) {
  const lista = fotosDe(rs, w);
  const n = { act: rs.length - m.perdidas.length, nue: m.ganadas.length, per: m.perdidas.length, todas: rs.length };
  const chips = VER_EX.map(([k, t]) => `<button class="chip" type="button" data-exver="${k}" aria-pressed="${st.exVer === k}">${t} <b>${fmt(n[k])}</b></button>`).join("");
  const sinFotos = !D.formularios.ex.fotos?.base;
  const tarjetas = lista.slice(0, st.limit).map(r => {
    const [txt, cls] = badgeEx(r, w);
    const ps = fotosClave(r, w), doble = ps.length > 1;
    const celdas = ps.map((p, i) => `<div class="cel" data-fi="${fotosHasta(r, w).indexOf(p)}"><img data-t="${esc(p.id)}" alt="${esc(etiquetaFoto(p) + " · " + r.tipo + " · " + r.loc)}">${doble ? `<span class="etq">${esc(etiquetaFoto(p))}</span>` : ""}</div>`).join("");
    return `<button class="foto${doble ? " doble" : ""}" type="button" data-foto="${esc(r.id)}">
      <div class="img">${celdas || "Sin foto"}</div>
      <span class="badge ${cls}">${txt}</span>
      <div class="pie"><b>${esc(r.loc)}</b>${esc(r.tipo)} · ${esc(r.cat.join(", "))}
        <div class="sub">${esc(r.can)} · ${esc(r.cad)} · ${esc(r.zon)}</div>
        <div class="sub">Ganada ${fdate(r.alta)} · ${perdidaEn(r, w) ? `duró ${nDias(dias(r.alta, r.baja))}` : `lleva ${nDias(dias(r.alta, w.fin))}`}</div></div></button>`;
  }).join("");
  return `<section class="card">
    <div class="card-head"><h2>Fotos de exhibiciones</h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="sub" id="pptMsg" role="status"></span>
        <button class="ppt-btn" type="button" data-ppt ${lista.length ? "" : "disabled"}>Armar PPT (${fmt(lista.length)})</button></div></div>
    <div class="chips">${chips}</div>
    ${sinFotos ? '<p class="sub">Las fotos todavía no están publicadas; aparecerán en la próxima actualización.</p>' : ""}
    ${lista.length ? `<div class="galeria">${tarjetas}</div>
      ${lista.length > st.limit ? `<button class="btn2 more" type="button" data-more>Ver más (${fmt(lista.length - st.limit)} restantes)</button>` : ""}`
      : '<p class="empty">No hay exhibiciones con estos filtros.</p>'}
    <p class="sub" style="margin:10px 0 0">Si la exhibición dura más de una semana se ve la foto de cuando se ganó junto a la de seguimiento más reciente. El PPT usa la semana, los filtros y la lista elegida (${esc(VER_EX.find(v => v[0] === st.exVer)[1].toLowerCase())}), con 4 fotos por diapositiva agrupadas por cadena.</p>
  </section>`;
}

let llaveFotos = null;
async function claveFotos() {
  const F = D.formularios.ex.fotos;
  if (!F.cifrado) return null;
  if (!llaveFotos) {
    const b = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(CLAVE), "PBKDF2", false, ["deriveKey"]);
    llaveFotos = crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(F.sal), iterations: F.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  return llaveFotos;
}

// tipo "t" = miniatura, "g" = grande. Devuelve un Blob JPEG (en caché).
const cacheFotos = new Map();
function foto(id, tipo) {
  const k = tipo + id;
  if (!cacheFotos.has(k)) cacheFotos.set(k, (async () => {
    const F = D.formularios.ex.fotos;
    const r = await fetch(`${F.base}${tipo}/${id}${F.ext}`);
    if (!r.ok) throw new Error(`foto ${r.status}`);
    let datos = await r.arrayBuffer();
    const llave = await claveFotos();
    if (llave) datos = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(datos, 0, 12) }, llave, new Uint8Array(datos, 12));
    return new Blob([datos], { type: "image/jpeg" });
  })().catch(e => { cacheFotos.delete(k); throw e; }));
  return cacheFotos.get(k);
}
const urls = new Map();
async function urlFoto(id, tipo) {
  const k = tipo + id;
  if (!urls.has(k)) urls.set(k, URL.createObjectURL(await foto(id, tipo)));
  return urls.get(k);
}

let observador;
function cargarMiniaturas() {
  if (!D.formularios.ex.fotos?.base) return;
  observador?.disconnect();
  observador = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    observador.unobserve(e.target);
    urlFoto(e.target.dataset.t, "t").then(u => { e.target.src = u; }).catch(() => { e.target.replaceWith("Sin foto"); });
  }), { rootMargin: "300px" });
  document.querySelectorAll("img[data-t]").forEach(i => observador.observe(i));
}

// La foto ampliada: todas las fotos de la exhibición hasta esa semana; fi = cuál.
let fotoAbierta = null, fotoActual = null;
function abrirFoto(id, fi) {
  const r = D.formularios.ex.filas.find(x => x.id === id); if (!r) return;
  const w = semanaEx(st.per.ex), ps = fotosHasta(r, w);
  fotoAbierta = r;
  $("#fotoInfo").innerHTML = `<b>${esc(r.tipo)} · ${esc(r.loc)}</b><div class="sub">${esc(r.can)} · ${esc(r.cad)} · ${esc(r.zon)} · ${esc(r.mer)}</div>
    <div class="sub">${esc(r.skus.join(" + "))}</div>
    <div class="sub">Ganada el ${fdate(r.alta)} · ${perdidaEn(r, w) ? `perdida el ${fdate(r.baja)}${r.mot ? " · " + esc(r.mot) : ""}` : `activa, lleva ${nDias(dias(r.alta, w.fin))}`}</div>`;
  $("#fotoDlg").showModal();
  mostrarFoto(ps[fi ?? ps.length - 1]);
}

async function mostrarFoto(p) {
  const r = fotoAbierta, ps = fotosHasta(r, semanaEx(st.per.ex)), img = $("#fotoImg");
  fotoActual = p || null;
  $("#fotoNav").innerHTML = ps.length > 1 ? ps.map((x, i) => `<button class="chip" type="button" data-fnav="${i}" aria-pressed="${x === p}">${esc(etiquetaFoto(x))}</button>`).join("") : "";
  $("#fotoBajar").disabled = !p;
  img.removeAttribute("src");
  if (!p || !D.formularios.ex.fotos?.base) return;
  try {
    if (urls.has("t" + p.id)) img.src = urls.get("t" + p.id);  // se ve al instante; luego la buena
    const u = await urlFoto(p.id, "g");
    if (fotoActual === p) img.src = u;
  } catch (e) { $("#fotoInfo").insertAdjacentHTML("beforeend", '<div class="sub" style="color:var(--falta)">No se pudo cargar la foto.</div>'); }
}

const nombreArchivo = s => norm(s).replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 80);
async function bajarFoto() {
  const r = fotoAbierta, p = fotoActual; if (!r || !p) return;
  const a = document.createElement("a");
  a.href = await urlFoto(p.id, "g");
  a.download = `${nombreArchivo(`${r.loc} ${r.tipo} ${p.s ? "seguimiento" : "ganada"} ${p.f}`)}.jpg`;
  document.body.appendChild(a); a.click(); a.remove();
}
$("#fotoNav").addEventListener("click", ev => {
  const b = ev.target.closest("[data-fnav]"); if (!b) return;
  mostrarFoto(fotosHasta(fotoAbierta, semanaEx(st.per.ex))[+b.dataset.fnav]);
});
$("#fotoCerrar").onclick = () => $("#fotoDlg").close();
$("#fotoBajar").onclick = bajarFoto;
$("#fotoDlg").addEventListener("click", ev => { if (ev.target === $("#fotoDlg")) $("#fotoDlg").close(); });

/* ---------- PPT con formato.pptx ---------- */
// plantilla_ppt.pptx es formato.pptx con solo la portada. Aquí se llena la
// portada y se agregan diapositivas como las del formato: franja roja con la
// cadena, 4 fotos con su etiqueta y pie, y la línea de cadena abajo.
const EMU_COLS = [243687, 3224631, 6205575, 9186520];
const FOTO_Y = 1546860, FOTO_W = 2761487, FOTO_H = 3681983;
const xml = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const corta = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;

function cargarScript(src) {
  return new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => mal(new Error("sin conexión")); document.head.appendChild(s); });
}

function run(t, sz, color, b = false) {
  return `<a:r><a:rPr lang="es-EC" sz="${sz}" b="${b ? 1 : 0}" dirty="0"><a:solidFill><a:srgbClr val="${color}"/></a:solidFill><a:latin typeface="Calibri"/></a:rPr><a:t>${xml(t)}</a:t></a:r>`;
}
function caja(id, nombre, x, y, cx, cy, parrafos, algn = "l", anchor = "t") {
  return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="${nombre}"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${x}" y="${y}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr><p:txBody><a:bodyPr wrap="square" anchor="${anchor}"><a:spAutoFit/></a:bodyPr><a:lstStyle/>${parrafos.map(p => `<a:p><a:pPr algn="${algn}"/>${p}</a:p>`).join("")}</p:txBody></p:sp>`;
}
function forma(id, nombre, x, y, cx, cy, color, geom = "rect", texto = "") {
  return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="${nombre}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${x}" y="${y}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="${geom}"><a:avLst/></a:prstGeom><a:solidFill><a:srgbClr val="${color}"/></a:solidFill><a:ln><a:noFill/></a:ln></p:spPr><p:txBody><a:bodyPr rtlCol="0" anchor="ctr" lIns="0" rIns="0" tIns="0" bIns="0"/><a:lstStyle/><a:p><a:pPr algn="ctr"/>${texto || '<a:endParaRPr lang="es-EC"/>'}</a:p></p:txBody></p:sp>`;
}
const PASO_COL = EMU_COLS[1] - EMU_COLS[0];
// Recorta la foto para llenar el marco 3:4 sin deformarla (como en el formato).
function recorte([w, h]) {
  const marco = FOTO_W / FOTO_H, img = w / h;
  if (Math.abs(img - marco) < 0.01) return "";
  if (img > marco) { const c = Math.round((1 - marco / img) / 2 * 100000); return `<a:srcRect l="${c}" r="${c}"/>`; }
  const c = Math.round((1 - img / marco) / 2 * 100000); return `<a:srcRect t="${c}" b="${c}"/>`;
}

function diapositiva(cadena, sub, pie, items, w) {
  let id = 2, rid = 2;
  const partes = [forma(id++, "Franja", 0, 0, 12191695, 1170432, "E2211C"),
    caja(id++, "Titulo", 274320, 91440, 11643055, 566928, [run(cadena, 2000, "FFFFFF", true)], "l", "ctr"),
    caja(id++, "Subtitulo", 274320, 640080, 11643055, 411480, [run(sub, 1200, "FFDEDC")], "l", "ctr")];
  const rels = [];
  // Cada item ocupa 1 columna, o 2 si muestra la foto de alta y la de seguimiento.
  items.forEach((it, i) => {
    const r = it.r, x = EMU_COLS[it.col], ancho = (it.fotos.length || 1) - 1;
    const doble = it.fotos.length > 1;
    it.fotos.forEach((p, j) => {
      const xf = x + j * PASO_COL;
      if (p.media) {
        const k = `rId${rid++}`;
        rels.push(`<Relationship Id="${k}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/${p.media}"/>`);
        partes.push(`<p:pic><p:nvPicPr><p:cNvPr id="${id++}" name="Foto ${i + 1}.${j + 1}" descr="${xml(etiquetaFoto(p) + " · " + r.tipo + " · " + r.loc)}"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="${k}"/>${recorte(p.d)}<a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="${xf}" y="${FOTO_Y}"/><a:ext cx="${FOTO_W}" cy="${FOTO_H}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>`);
      } else {
        partes.push(forma(id++, `Sin foto ${i + 1}.${j + 1}`, xf, FOTO_Y, FOTO_W, FOTO_H, "F2F2F2", "rect", run("Sin foto", 1200, "6B6B6B")));
      }
      if (doble) {
        const t = etiquetaFoto(p);
        partes.push(forma(id++, `Fecha foto ${i + 1}.${j + 1}`, xf + 73152, FOTO_Y + FOTO_H - 73152 - 228600, 140000 + t.length * 66000, 228600, "242424", "roundRect", run(t, 900, "FFFFFF", true)));
      }
    });
    if (!it.fotos.length) partes.push(forma(id++, `Sin foto ${i + 1}`, x, FOTO_Y, FOTO_W, FOTO_H, "F2F2F2", "rect", run("Sin foto", 1200, "6B6B6B")));
    const [txt, , color] = badgeEx(r, w);
    partes.push(forma(id++, `Estado ${i + 1}`, x + 73152, FOTO_Y + 73152, 120000 + txt.length * 90000, 265176, color, "roundRect", run(txt, 1000, "FFFFFF", true)));
    const estado = perdidaEn(r, w) ? `Perdida ${fdate(r.baja)} · duró ${nDias(dias(r.alta, r.baja))}` : `Activa · ${nDias(dias(r.alta, w.fin))}`;
    partes.push(caja(id++, `Pie ${i + 1}`, x, 5486400, 2761488 + ancho * PASO_COL, 841248, [
      run(r.loc, 1000, "242424", true),
      run(`${r.tipo} · ${r.cat.join(", ")} · ${r.can}`, 900, "6B6B6B"),
      run(corta(r.skus.join(" + "), 90 + ancho * 100), 800, "6B6B6B"),
      run(`Ganada ${fdate(r.alta)}/${r.alta.slice(0, 4)} · ${estado}`, 800, "6B6B6B")], "ctr"));
  });
  partes.push(caja(id++, "Pie de pagina", 274320, 6455664, 11643055, 274320, [run(pie, 900, "6B6B6B")], "l", "ctr"));
  const s = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"><p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr><p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>${partes.join("")}</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>`;
  const r = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout7.xml"/>${rels.join("")}</Relationships>`;
  return [s, r];
}

async function armarPpt() {
  const f = D.formularios.ex, w = semanaEx(st.per.ex);
  const lista = fotosDe(filasPeriodo(f), w);
  const btn = document.querySelector("[data-ppt]"), msg = t => { const m = $("#pptMsg"); if (m) m.textContent = t; };
  if (!lista.length) return;
  btn.disabled = true;
  try {
    msg("Preparando…");
    if (!window.JSZip) await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip = await JSZip.loadAsync(await (await fetch("plantilla_ppt.pptx")).arrayBuffer());
    const per = f.periodos.find(p => p.id === st.per.ex)?.label || "";
    const filtros = [st.can, st.cad, st.neg, st.cat, st.sup, st.q && `“${st.q}”`].filter(Boolean);
    const verTxt = VER_EX.find(v => v[0] === st.exVer)[1];
    const titulo = st.cad || "EXHIBICIONES GANADAS";
    const subtitulo = `${per}${filtros.length ? " · " + filtros.join(" · ") : ""}`;

    // Portada del formato con nuestro título.
    let portada = await zip.file("ppt/slides/slide1.xml").async("string");
    portada = portada.replace(/<a:t>ATIMASA S\.A\.<\/a:t>/, `<a:t>${xml(titulo.toUpperCase())}</a:t>`)
      .replace(/<a:t>REVESIMIENTO SUPERIOR<\/a:t>/, `<a:t>${xml(`${st.cad ? "Exhibiciones ganadas" : "Todas las cadenas"} · ${verTxt}`)}</a:t>`)
      .replace("</a:p></p:txBody></p:sp></p:spTree>", `</a:p><a:p><a:pPr algn="ctr"/>${run(subtitulo, 1600, "FFDEDC")}</a:p></p:txBody></p:sp></p:spTree>`);
    zip.file("ppt/slides/slide1.xml", portada);

    // Fotos grandes, 4 a la vez.
    let hechas = 0;
    const pedidas = f.fotos?.base ? lista.flatMap(r => fotosClave(r, w)) : [];
    const blobs = new Map();
    for (let i = 0; i < pedidas.length; i += 4) {
      await Promise.all(pedidas.slice(i, i + 4).map(async p => {
        try { blobs.set(p.id, await (await foto(p.id, "g")).arrayBuffer()); } catch (e) { /* queda «Sin foto» */ }
        msg(`Bajando fotos ${++hechas} de ${pedidas.length}…`);
      }));
    }

    // Diapositivas: por cadena, 4 columnas cada una; la exhibición con foto de
    // alta y de seguimiento ocupa 2 columnas y no se parte entre diapositivas.
    const grupos = new Map();
    for (const r of lista) { if (!grupos.has(r.cad)) grupos.set(r.cad, []); grupos.get(r.cad).push(r); }
    let n = 1, ct = await zip.file("[Content_Types].xml").async("string");
    let pres = await zip.file("ppt/presentation.xml").async("string");
    let presRels = await zip.file("ppt/_rels/presentation.xml.rels").async("string");
    const ids = [], rels = [], tipos = [];
    for (const [cad, xs] of grupos) {
      const hojas = [[]];
      let col = 0;
      for (const r of xs) {
        const ps = fotosClave(r, w), ancho = Math.max(1, ps.length);
        if (col + ancho > 4) { hojas.push([]); col = 0; }
        hojas[hojas.length - 1].push({ r, col, ps });
        col += ancho;
      }
      const paginas = hojas.length;
      for (let p = 0; p < paginas; p++) {
        n++;
        const items = hojas[p].map(({ r, col, ps }, i) => ({
          r, col, fotos: ps.map((x, j) => {
            const media = blobs.has(x.id) ? `exh_${n}_${i + 1}_${j + 1}.jpg` : "";
            if (media) zip.file(`ppt/media/${media}`, blobs.get(x.id));
            return { ...x, media };
          }),
        }));
        const zonas = [...new Set(xs.map(r => r.zon))].join(", ");
        const pie = `Cadena: ${cad}   ·   Zona: ${corta(zonas, 80)}   ·   ${per}${paginas > 1 ? `   ·   ${p + 1} de ${paginas}` : ""}`;
        const [s, r] = diapositiva(cad, `Exhibiciones ganadas · ${verTxt} · ${fmt(xs.length)} ${xs.length === 1 ? "exhibición" : "exhibiciones"}`, pie, items, w);
        zip.file(`ppt/slides/slide${n}.xml`, s);
        zip.file(`ppt/slides/_rels/slide${n}.xml.rels`, r);
        ids.push(`<p:sldId id="${300 + n}" r:id="rIdS${n}"/>`);  // la portada usa 258
        rels.push(`<Relationship Id="rIdS${n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${n}.xml"/>`);
        tipos.push(`<Override PartName="/ppt/slides/slide${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`);
      }
    }
    zip.file("ppt/presentation.xml", pres.replace("</p:sldIdLst>", ids.join("") + "</p:sldIdLst>"));
    zip.file("ppt/_rels/presentation.xml.rels", presRels.replace("</Relationships>", rels.join("") + "</Relationships>"));
    zip.file("[Content_Types].xml", ct.replace("</Types>", tipos.join("") + "</Types>"));
    const app = await zip.file("docProps/app.xml").async("string");
    zip.file("docProps/app.xml", app.replace(/<Slides>\d+<\/Slides>/, `<Slides>${n}</Slides>`));

    msg("Generando archivo…");
    const blob = await zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.presentationml.presentation" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `exhibiciones_${nombreArchivo([...filtros, verTxt].join(" ")) || "todas"}_semana${(per.match(/^Semana (\d+)/) || [])[1] || ""}.pptx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    const faltan = lista.filter(r => !fotosClave(r, w).some(p => blobs.has(p.id))).length;
    msg(`Listo: ${n} diapositivas${faltan ? ` · ${faltan} sin foto` : ""}`);
  } catch (e) {
    msg(`No se pudo armar el PPT (${e.message}).`);
  } finally { btn.disabled = false; }
}

function descargarEx(f) {
