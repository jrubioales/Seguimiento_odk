  const w = semanaEx(st.per.ex), per = f.periodos.find(p => p.id === st.per.ex)?.label || "";
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const cab = ["Semana", "Estado al cierre", "Ganada en la semana", "Local", "Código", "Canal", "Cadena", "Zona", "Tipo", "Negocio", "Categoría", "SKU", "Mercaderista", "Supervisor", "Fecha alta", "Fecha baja", "Días activa", "Última vez vista", "Motivo baja", "Comentario", "Fotos"];
  const rs = filasPeriodo(f).sort((a, b) => a.loc.localeCompare(b.loc, "es"));
  const lineas = [cab.map(q).join(";")].concat(rs.map(r => {
    const perdida = r.baja && r.baja <= w.fin;
    return [per, perdida ? "Perdida" : "Activa", r.alta >= w.ini ? "Sí" : "No", r.loc, r.lid, r.can, r.cad, r.zon, r.tipo, r.neg.join(", "), r.cat.join(", "), r.skus.join(" + "),
      r.mer, r.sup, fdate(r.alta), perdida ? fdate(r.baja) : "", perdida ? dias(r.alta, r.baja) : dias(r.alta, w.fin), fdate(r.vista), perdida ? r.mot : "", perdida ? r.com : "",
      fotosHasta(r, w).map(etiquetaFoto).join(" | ")].map(q).join(";");
  }));
  bajar(lineas, `exhibiciones_ganadas_${st.per.ex}.csv`);
}

/* ---------- eventos ---------- */
document.addEventListener("change", ev => {
  const k = ev.target.dataset?.f; if (!k || k === "q") return;
  if (k === "dim") { st.dim = ev.target.value; st.abiertos.clear(); renderMain(D.formularios[st.tab]); return; }
  if (k === "per") st.per[st.tab] = ev.target.value; else { st[k] = ev.target.value; if (k === "neg") st.cat = ""; if (k === "can" || k === "zon") st.cad = ""; if (k === "can") st.zon = ""; }
  st.limit = 100; render();
});
let tq;
document.addEventListener("input", ev => {
  if (ev.target.dataset?.f !== "q") return;
  clearTimeout(tq); tq = setTimeout(() => { st.q = ev.target.value; st.limit = 100; renderMain(D.formularios[st.tab]); }, 200);
});
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab],[data-per],[data-mer],[data-grp],[data-vista],[data-ver],[data-exvista],[data-exver],[data-foto],[data-ppt],[data-more],[data-csv],[data-f='clear']"); if (!t) return;
  const d = t.dataset;  if (d.exvista) { st.exVista = d.exvista; st.limit = 100; renderMain(D.formularios[st.tab]); return; }
  if (d.exver) { st.exVer = d.exver; st.limit = 100; renderMain(D.formularios[st.tab]); return; }
  if (d.foto) { const fi = ev.target.closest("[data-fi]")?.dataset.fi; abrirFoto(d.foto, fi === undefined ? undefined : +fi); return; }
  if ("ppt" in d) { armarPpt(); return; }
  if (d.grp) { st.abiertos.has(d.grp) ? st.abiertos.delete(d.grp) : st.abiertos.add(d.grp); renderMain(D.formularios[st.tab]); return; }
  if (d.tab) { st.tab = d.tab; st.abiertos.clear(); st.limit = 100; render(); return; }
  if (d.f === "clear") { for (const k of FILTROS) st[k] = ""; render(); return; }
  if (d.per) { st.per[st.tab] = d.per; st.abiertos.clear(); st.limit = 100; render(); return; }
  if ("mer" in d) { st.abiertos.has(d.mer) ? st.abiertos.delete(d.mer) : st.abiertos.add(d.mer); renderMain(D.formularios[st.tab]); return; }
  if (d.vista) { st.vista = d.vista; renderMain(D.formularios[st.tab]); return; }
  if (d.ver) { st.ver = d.ver; st.limit = 100; renderMain(D.formularios[st.tab]); return; }
  if ("more" in d) { st.limit += 200; renderMain(D.formularios[st.tab]); return; }
  if ("csv" in d) descargar(D.formularios[st.tab]);
});

function descargar(f) {
  if (f.key === "ex") return descargarEx(f);
  const rs = filasPeriodo(f).sort((a, b) => a.mer.localeCompare(b.mer, "es") || a.loc.localeCompare(b.loc, "es"));
  const est = r => r.e === "ok" ? "Subido" : r.e === "nov" ? "Subido con novedad" : "Falta subir";
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const per = f.periodos.find(p => p.id === st.per[f.key])?.label || "";
  const canal = f.can_titulo ? [f.key === "pl" ? "Plan" : "Canal"] : [];
  const cab = ["Periodo", "Estado", "Mercaderista", "Supervisor", "Zona", "Local", "Código", "Cadena / cliente", ...canal, ...(f.key === "ac" ? ["Acuerdo"] : []), "Negocio", "Categoría", "Fecha", "Subido por", "Novedad"];
  const lineas = [cab.map(q).join(";")].concat(rs.map(r => [per, est(r), r.mer, r.sup, r.zon, r.loc, r.id, r.cad, ...(canal.length ? [r.can] : []), ...(f.key === "ac" ? [r.acu] : []), r.neg.join(", "), r.cat.join(", "), fdate(r.f), r.por, r.nov.join(" | ")].map(q).join(";")));
  bajar(lineas, `seguimiento_${f.key}_${st.per[f.key]}.csv`);
}

function bajar(lineas, nombre) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lineas.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

iniciar();
</script>
</body>
</html>
